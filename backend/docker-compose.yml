version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: legal_ai_db
    environment:
      POSTGRES_DB: lawyerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vallabh}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/optimize_indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql
    networks:
      - legal_ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_ai_backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-vallabh}@postgres:5432/lawyerdb
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legal_ai_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  legal_ai_network:
    driver: bridge
